<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ngo Quoc Viet — open-source adventurer</title>
  <desc id="desc">Animated retro pixel art banner for Ngo Quoc Viet, a fullstack engineer and open-source contributor focused on developer platforms, AI tooling, and Windows reliability.</desc>

  <style><![CDATA[
    .cloud-a { animation: cloudA 18s linear infinite; }
    .cloud-b { animation: cloudB 24s linear infinite; }
    .hero-sprite { animation: heroBob 1.1s steps(2, end) infinite; transform-origin: center bottom; }
    .spark-a { animation: blink 1.3s steps(2, end) infinite; }
    .spark-b { animation: blink 1.9s steps(2, end) infinite .4s; }
    .spark-c { animation: blink 1.6s steps(2, end) infinite .8s; }
    .flag { animation: flagWave 1s steps(2, end) infinite; transform-origin: 1010px 174px; }
    .xp-fill { animation: xpPulse 2.2s ease-in-out infinite; }
    .cursor { animation: blink .9s steps(2, end) infinite; }
    .scan { animation: scanMove 4.5s linear infinite; }

    @keyframes cloudA {
      from { transform: translateX(-180px); }
      to { transform: translateX(1320px); }
    }
    @keyframes cloudB {
      from { transform: translateX(-420px); }
      to { transform: translateX(1200px); }
    }
    @keyframes heroBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: .22; }
    }
    @keyframes flagWave {
      0%, 100% { transform: skewY(0deg); }
      50% { transform: skewY(3deg); }
    }
    @keyframes xpPulse {
      0%, 100% { opacity: .88; }
      50% { opacity: 1; }
    }
    @keyframes scanMove {
      from { transform: translateX(-260px); }
      to { transform: translateX(1460px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud-a, .cloud-b, .hero-sprite, .spark-a, .spark-b, .spark-c, .flag, .xp-fill, .cursor, .scan {
        animation: none;
      }
    }
  ]]></style>

  <defs>
    <linearGradient id="sky" x1="600" y1="0" x2="600" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76C6ED"/>
      <stop offset="1" stop-color="#B9E3F4"/>
    </linearGradient>
    <linearGradient id="panel" x1="84" y1="38" x2="730" y2="302" gradientUnits="userSpaceOnUse">
      <stop stop-color="#183143" stop-opacity=".95"/>
      <stop offset="1" stop-color="#102532" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="xp" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F5C542"/>
      <stop offset=".52" stop-color="#FFF27A"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity=".035"/>
    </pattern>
    <clipPath id="banner-clip">
      <rect width="1200" height="360" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#banner-clip)" shape-rendering="crispEdges">
    <rect width="1200" height="360" fill="url(#sky)"/>

    <!-- Sun and distant sparkles -->
    <rect x="1034" y="38" width="58" height="58" fill="#FFE36A"/>
    <rect x="1044" y="28" width="38" height="78" fill="#FFE36A" opacity=".35"/>
    <rect x="1024" y="48" width="78" height="38" fill="#FFE36A" opacity=".35"/>
    <g class="spark-a" fill="#FFF8C7">
      <rect x="860" y="54" width="7" height="23"/>
      <rect x="852" y="62" width="23" height="7"/>
    </g>
    <g class="spark-b" fill="#FFF8C7">
      <rect x="938" y="103" width="6" height="18"/>
      <rect x="932" y="109" width="18" height="6"/>
    </g>
    <g class="spark-c" fill="#FFF8C7">
      <rect x="1112" y="128" width="6" height="18"/>
      <rect x="1106" y="134" width="18" height="6"/>
    </g>

    <!-- Animated clouds -->
    <g class="cloud-a" fill="#F7FCFF" opacity=".9">
      <rect x="0" y="78" width="80" height="18"/>
      <rect x="18" y="62" width="48" height="18"/>
      <rect x="34" y="50" width="28" height="18"/>
      <rect x="68" y="84" width="48" height="12"/>
    </g>
    <g class="cloud-b" fill="#F7FCFF" opacity=".72">
      <rect x="330" y="126" width="92" height="14"/>
      <rect x="350" y="112" width="58" height="17"/>
      <rect x="372" y="102" width="30" height="13"/>
      <rect x="414" y="130" width="46" height="10"/>
    </g>

    <!-- Mountains -->
    <path d="M0 238L92 142L184 238H0Z" fill="#709777"/>
    <path d="M118 238L246 112L374 238H118Z" fill="#5D8370"/>
    <path d="M308 238L414 154L520 238H308Z" fill="#789A78"/>
    <path d="M475 238L612 124L749 238H475Z" fill="#638773"/>
    <path d="M678 238L796 150L914 238H678Z" fill="#739379"/>
    <path d="M860 238L1012 108L1164 238H860Z" fill="#5A7F71"/>
    <path d="M1032 238L1138 152L1244 238H1032Z" fill="#6D9076"/>
    <path d="M184 174L246 112L302 168L268 158L246 136L224 162Z" fill="#E8F2E7"/>
    <path d="M960 153L1012 108L1065 153L1036 144L1011 126L989 146Z" fill="#E8F2E7"/>

    <!-- Forest -->
    <g fill="#345A3C">
      <path d="M0 282L32 210L64 282H0Z"/>
      <path d="M45 282L78 198L111 282H45Z"/>
      <path d="M96 282L130 218L164 282H96Z"/>
      <path d="M694 282L728 205L762 282H694Z"/>
      <path d="M742 282L780 190L818 282H742Z"/>
      <path d="M806 282L842 214L878 282H806Z"/>
      <path d="M1110 282L1142 202L1174 282H1110Z"/>
      <path d="M1150 282L1184 216L1218 282H1150Z"/>
    </g>
    <g fill="#487248">
      <path d="M15 282L46 226L77 282H15Z"/>
      <path d="M115 282L148 207L181 282H115Z"/>
      <path d="M658 282L692 224L726 282H658Z"/>
      <path d="M835 282L870 201L905 282H835Z"/>
      <path d="M1066 282L1101 218L1136 282H1066Z"/>
    </g>

    <!-- Ground -->
    <rect y="278" width="1200" height="82" fill="#5F873A"/>
    <rect y="278" width="1200" height="12" fill="#91BD57"/>
    <rect y="326" width="1200" height="34" fill="#44652F"/>
    <path d="M0 " fill="#527535"/>
    <g fill="#729B46">
      <rect x="26" y="338" width="12" height="8"/>
      <rect x="210" y="316" width="16" height="8"/>
      <rect x="622" y="338" width="14" height="8"/>
      <rect x="1088" y="314" width="18" height="8"/>
    </g>

    <!-- Main information panel -->
    <rect x="74" y="34" width="690" height="270" fill="#0B1720" opacity=".28"/>
    <rect x="66" y="28" width="690" height="270" fill="url(#panel)" stroke="#F1D37A" stroke-width="4"/>
    <rect x="78" y="40" width="666" height="246" fill="none" stroke="#6CA89A" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="66" y="28" width="22" height="22" fill="#F1D37A"/>
    <rect x="734" y="28" width="22" height="22" fill="#F1D37A"/>
    <rect x="66" y="276" width="22" height="22" fill="#F1D37A"/>
    <rect x="734" y="276" width="22" height="22" fill="#F1D37A"/>

    <text x="104" y="70" fill="#7DE2CA" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" letter-spacing="2">PLAYER 01 // OPEN-SOURCE ADVENTURER</text>
    <text x="100" y="137" fill="#FFF8D8" stroke="#172A31" stroke-width="7" paint-order="stroke" font-family="Consolas, 'Courier New', monospace" font-size="55" font-weight="900" letter-spacing="-4">NGO QUOC VIET</text>
    <text x="102" y="173" fill="#F7D774" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="800">FULLSTACK ENGINEER · OSS CONTRIBUTOR</text>
    <text x="102" y="206" fill="#C7E2E1" font-family="Consolas, 'Courier New', monospace" font-size="14">Developer platforms · AI tooling · Windows DX</text>
    <text x="102" y="230" fill="#8DB8B3" font-family="Consolas, 'Courier New', monospace" font-size="13">Practical fixes. Regression coverage. Maintainer-friendly delivery.</text>

    <!-- XP bar -->
    <text x="102" y="265" fill="#FFF3B0" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="800">OSS XP</text>
    <rect x="174" y="252" width="520" height="18" fill="#08141B" stroke="#54776E" stroke-width="2"/>
    <rect class="xp-fill" x="180" y="258" width="462" height="6" fill="url(#xp)"/>
    <rect x="650" y="258" width="38" height="6" fill="#2D4B47"/>
    <g class="scan" opacity=".34">
      <rect x="-210" y="258" width="86" height="6" fill="#FFFFFF"/>
    </g>
    <text x="704" y="265" fill="#7DE2CA" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="800">LV.107</text>

    <!-- Pixel flag and castle -->
    <rect x="1004" y="164" width="8" height="118" fill="#4B3827"/>
    <g class="flag">
      <rect x="1012" y="174" width="74" height="14" fill="#315A83"/>
      <rect x="1012" y="188" width="62" height="14" fill="#F0C94B"/>
      <rect x="1012" y="202" width="50" height="14" fill="#315A83"/>
    </g>
    <rect x="1000" y="238" width="136" height="44" fill="#7B684C"/>
    <rect x="1012" y="220" width="28" height="62" fill="#8C7655"/>
    <rect x="1088" y="220" width="28" height="62" fill="#8C7655"/>
    <rect x="1036" y="244" width="56" height="38" fill="#927A57"/>
    <rect x="1052" y="256" width="24" height="26" fill="#314A45"/>
    <rect x="1008" y="212" width="8" height="12" fill="#8C7655"/>
    <rect x="1022" y="212" width="8" height="12" fill="#8C7655"/>
    <rect x="1094" y="212" width="8" height="12" fill="#8C7655"/>
    <rect x="1108" y="212" width="8" height="12" fill="#8C7655"/>

    <!-- Developer adventurer sprite -->
    <g transform="translate(855 180)">
      <g class="hero-sprite">
      <!-- shadow -->
      <rect x="2" y="104" width="94" height="12" fill="#2F4A29" opacity=".55"/>
      <!-- sword -->
      <rect x="84" y="42" width="8" height="54" fill="#DDE7E8"/>
      <rect x="82" y="36" width="12" height="12" fill="#F6D461"/>
      <rect x="78" y="46" width="20" height="6" fill="#6B4B2F"/>
      <!-- legs -->
      <rect x="34" y="82" width="18" height="28" fill="#2F3742"/>
      <rect x="58" y="82" width="18" height="28" fill="#2F3742"/>
      <rect x="28" y="108" width="28" height="10" fill="#22303C"/>
      <rect x="56" y="108" width="28" height="10" fill="#22303C"/>
      <!-- body -->
      <rect x="25" y="43" width="58" height="43" fill="#315A83"/>
      <rect x="19" y="51" width="12" height="32" fill="#E0A36F"/>
      <rect x="77" y="51" width="12" height="32" fill="#E0A36F"/>
      <rect x="39" y="43" width="30" height="8" fill="#4B80AC"/>
      <rect x="52" y="52" width="7" height="7" fill="#F4D35E"/>
      <!-- backpack -->
      <rect x="15" y="47" width="11" height="37" fill="#77543A"/>
      <!-- head -->
      <rect x="32" y="8" width="43" height="38" fill="#E0A36F"/>
      <rect x="25" y="15" width="10" height="27" fill="#5A3928"/>
      <rect x="32" y="1" width="43" height="14" fill="#3C291F"/>
      <rect x="68" y="8" width="14" height="23" fill="#3C291F"/>
      <rect x="42" y="23" width="6" height="6" fill="#1E293B"/>
      <rect x="62" y="23" width="6" height="6" fill="#1E293B"/>
      <rect x="50" y="34" width="12" height="5" fill="#8D503B"/>
      <!-- headset -->
      <rect x="24" y="18" width="6" height="18" fill="#183143"/>
      <rect x="80" y="18" width="6" height="18" fill="#183143"/>
      <rect x="74" y="33" width="17" height="5" fill="#183143"/>
        <rect x="88" y="35" width="7" height="7" fill="#7DE2CA"/>
      </g>
    </g>

    <!-- Quest HUD -->
    <rect x="790" y="36" width="322" height="112" fill="#142B35" opacity=".92" stroke="#F1D37A" stroke-width="3"/>
    <rect x="802" y="48" width="298" height="88" fill="none" stroke="#608C80" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="822" y="73" fill="#F7D774" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="800">CURRENT SAVE</text>
    <text x="822" y="103" fill="#FFF8D8" font-family="Consolas, 'Courier New', monospace" font-size="23" font-weight="900">107 MERGED QUESTS</text>
    <text x="822" y="126" fill="#9AC9C2" font-family="Consolas, 'Courier New', monospace" font-size="12">38 WORLDS · 60 ACTIVE <tspan class="cursor" fill="#7DE2CA">█</tspan></text>

    <!-- subtle scanline overlay -->
    <rect width="1200" height="360" fill="url(#scanlines)" pointer-events="none"/>
    <rect x="2" y="2" width="1196" height="356" rx="10" fill="none" stroke="#2D5360" stroke-width="4"/>
  </g>
</svg>
