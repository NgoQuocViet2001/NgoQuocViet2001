<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ngo Quoc Viet community OSS quest board</title>
  <desc id="desc">Retro RPG activity summary updated August 21, 2026: 96 external merged pull requests across 36 community repositories, with 63 active pull requests under review.</desc>

  <style><![CDATA[
    .check-a { animation: questCheck 1.8s steps(2, end) infinite; }
    .check-b { animation: questCheck 2.2s steps(2, end) infinite .35s; }
    .check-c { animation: questCheck 2s steps(2, end) infinite .7s; }
    .shine { animation: shineMove 5.4s linear infinite; }
    .gem { animation: gemPulse 1.7s steps(2, end) infinite; }
    .bar-a { animation: barPulse 2.8s ease-in-out infinite; }
    .bar-b { animation: barPulse 3.1s ease-in-out infinite .25s; }
    .bar-c { animation: barPulse 2.6s ease-in-out infinite .55s; }

    @keyframes questCheck {
      0%, 68%, 100% { opacity: 1; }
      69%, 82% { opacity: .45; }
    }
    @keyframes shineMove {
      from { transform: translateX(-250px); }
      to { transform: translateX(1460px); }
    }
    @keyframes gemPulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes barPulse {
      0%, 100% { opacity: .86; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .check-a, .check-b, .check-c, .shine, .gem, .bar-a, .bar-b, .bar-c {
        animation: none;
      }
    }
  ]]></style>

  <defs>
    <linearGradient id="paper" x1="600" y1="10" x2="600" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF2C7"/>
      <stop offset="1" stop-color="#EACF8E"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#755033"/>
      <stop offset=".5" stop-color="#4F3424"/>
      <stop offset="1" stop-color="#342219"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#D99D25"/>
      <stop offset=".55" stop-color="#FFE477"/>
      <stop offset="1" stop-color="#C98518"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3E6B35"/>
      <stop offset=".6" stop-color="#77A94C"/>
      <stop offset="1" stop-color="#A5CE63"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#315A83"/>
      <stop offset=".6" stop-color="#4C86B4"/>
      <stop offset="1" stop-color="#81B6D8"/>
    </linearGradient>
    <pattern id="paper-lines" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 18L18 0" stroke="#8C6A3F" stroke-opacity=".055"/>
      <path d="M-9 9L9 -9M9 27L27 9" stroke="#FFFFFF" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1200" height="430" rx="12"/>
    </clipPath>
  </defs>

