    <rect x="28" y="28" width="1144" height="374" fill="url(#paper)" stroke="#3E2A1E" stroke-width="4"/>
    <rect x="36" y="36" width="1128" height="358" fill="url(#paper-lines)"/>

    <!-- Pixel corner hardware -->
